{% extends "base.html" %}
{% block contenido %}

<style>
    body {background: #f4f7fb;}

    .header {
        background: linear-gradient(90deg, #004c99, #007acc);
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .logout {
        position: absolute;
        top: 20px;
        right: 30px;
        color: white;
        text-decoration: none;
        font-size: 14px;
    }

    .back {
        position: absolute;
        top: 20px;
        left: 30px;
        color: white;
        text-decoration: none;
        font-size: 14px;
    }

    .container {
        width: 95%;
        max-width: 1400px;
        margin: 30px auto;
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        border: 3px solid #004c99;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 25px;
    }

    .campo label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        color: #333;
    }

    .campo input,
    .campo select {
        width: 100%;
        padding: 10px;
        border: 2px solid #007acc;
        border-radius: 8px;
        box-sizing: border-box;
    }

    .botones {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-bottom: 30px;
    }

    .btn {
        width: auto;
        padding: 12px 20px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
    }

    .buscar {
        background: #007acc;
        color: white;
    }

    .limpiar {
        background: #007acc;
        color: white;
    }

    .desactivar {
        background: #007acc;
        color: white;
    }

    .modificar {
        background: #007acc;
        color: white;
    }

    .crear {
        background: #007acc;
        color: white;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background: #004c99;
        color: white;
        padding: 12px;
        border: 1px solid #007acc;
    }

    td {
        padding: 10px;
        border: 1px solid #007acc;
        text-align: center;
    }

    tr:nth-child(even) {
        background: #f9fcff;
    }

    tr:hover {
        background: #e6f2ff;
    }

    h2 {
        text-align: center;
        color: #004c99;
        margin-bottom: 25px;
    }
</style>

<div class="header">
    Gestión de Agencias
    <a href="/admin/dashboard" class="back">← Volver</a>
    <a href="/logout" class="logout">Cerrar sesión</a>
</div>

<div class="container">

    <h2>Administración de Agencias</h2>

    <div class="form-grid">

        <div class="campo">
            <label>Código Agencia</label>
            <input type="text" name="codigo_agencia">
        </div>

        <div class="campo">
            <label>Nombre Agencia</label>
            <input type="text" name="nombre_agencia">
        </div>

        <div class="campo">
            <label>Estado Agencia</label>
            <select name="estado_agencia">
                <option value="">Seleccione</option>
                <option>Activa</option>
                <option>Inactiva</option>
            </select>
        </div>

        <div class="campo">
            <label>Dirección Agencia</label>
            <input type="text" name="direccion_agencia">
        </div>

        <div class="campo">
            <label>Municipio Agencia</label>
            <input type="text" name="municipio_agencia">
        </div>

        <div class="campo">
            <label>Teléfono Agencia</label>
            <input type="text" name="telefono_agencia">
        </div>

    </div>

    <div class="botones">
        <button class="btn buscar">Buscar Agencia</button>
        <button class="btn limpiar">Limpiar Agencia</button>
        <button class="btn desactivar">Desactivar Agencia</button>
        <button class="btn modificar">Modificar Agencia</button>
        <button class="btn crear">Crear Agencia</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Código Agencia</th>
                <th>Nombre Agencia</th>
                <th>Estado Agencia</th>
                <th>Dirección Agencia</th>
                <th>Municipio Agencia</th>
                <th>Teléfono Agencia</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="6">
                    No hay registros para mostrar
                </td>
            </tr>
        </tbody>
    </table>

</div>

{% endblock %}
