{% extends "base.html" %}
{% block contenido %}
<style>
    body {
        background: #f4f7fb;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        margin: 0;
    }

    .header {
        background: linear-gradient(90deg, #004c99, #007acc);
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        box-sizing: border-box;
        width: 100%;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10;
    }

    .logout { position: absolute; top: 20px; right: 30px; color: white; text-decoration: none; font-size: 14px; }
    .back { position: absolute; top: 20px; left: 30px; color: white; text-decoration: none; font-size: 14px; }

    .form-box {
        margin-top: 100px; /* Espacio para que no lo tape el header */
        margin-bottom: 30px;
        background: white;
        border: 3px solid #004c99;
        border-radius: 12px;
        padding: 30px;
        width: 550px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        box-sizing: border-box;
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #004c99;
    }

    .form-grid {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    label {
        font-weight: bold;
        color: #004c99;
        display: block;
        margin-bottom: 6px;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 2px solid #007acc;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
    }

    input:focus {
        border-color: #004c99;
        outline: none;
    }

    .submit-btn {
        padding: 14px;
        background: linear-gradient(90deg, #004c99, #007acc);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .submit-btn:hover {
        transform: scale(1.03);
        box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    /* Estilos opcionales para alertas flash de Flask */
    .flash-messages {
        list-style: none;
        padding: 0;
        margin: 0 0 20px 0;
        text-align: center;
        font-weight: bold;
    }
    .flash-success { color: green; }
    .flash-error { color: #cc0000; }
</style>

<div class="header">
    Registro de Nueva Agencia
    <a href="/admin/gestion-agencias" class="back">← Volver</a>
    <a href="/logout" class="logout">Cerrar sesión</a>
</div>

<div class="form-box">
    <h2>Crear Agencia</h2>

    {% if error %}
        <div style="color: #cc0000; font-weight: bold; text-align: center; margin-bottom: 20px;">
            ⚠️ {{ error }}
        </div>
    {% endif %}

    {% if mensaje %}
        <div style="color: green; font-weight: bold; text-align: center; margin-bottom: 20px;">
            ✅ {{ mensaje }}
        </div>
    {% endif %}

    <form class="form-grid" method="POST" action="/admin/agencias/crear-agencia">
        <div>
            <label for="nombre">Nombre de la Agencia</label>
            <input id="nombre" name="nombre" type="text" placeholder="Ej: Agencia Zona Norte" required>
        </div>
        
        <div>
            <label for="direccion">Dirección</label>
            <input id="direccion" name="direccion" type="text" placeholder="Ej: Calle 10 # 4-25" required>
        </div>

        <div>
            <label for="municipio">Municipio / Ciudad</label>
            <input id="municipio" name="municipio" type="text" placeholder="Ej: Cali" required>
        </div>

        <div>
            <label for="telefono">Teléfono de Contacto</label>
            <input id="telefono" name="telefono" type="tel" placeholder="Ej: 3151234567" required>
        </div>

        <button type="submit" class="submit-btn">Guardar Agencia</button>
    </form>
</div>
{% endblock %}
