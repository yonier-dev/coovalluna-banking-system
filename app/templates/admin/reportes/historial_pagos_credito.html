{% extends "base.html" %}
{% block contenido %}
<style>
   body {
        background: #f4f7fb;
    }

    .header {
        background: linear-gradient(90deg, #004c99, #007acc);
        color: white;
        padding: 20px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .logout { position: absolute; top: 20px; right: 30px; color: white; text-decoration: none; }
    .back { position: absolute; top: 20px; left: 30px; color: white; text-decoration: none; }

    .container {
        width: 95%;
        max-width: 1200px;
        margin: 40px auto;
        background: white;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        border: 3px solid #004c99;
    }

    h2 {
        text-align: center;
        color: #004c99;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #555;
        margin-bottom: 40px;
        font-size: 16px;
    }

    .grid-reportes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 25px;
    }

    .card-reporte {
        background: #f8fbff;
        border: 2px solid #007acc;
        border-radius: 10px;
        padding: 25px;
        text-align: center;
        text-decoration: none;
        color: #333;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .card-reporte:hover {
        transform: translateY(-5px);
        background: #eaf4ff;
        box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        border-color: #004c99;
    }

    .card-reporte .numero {
        background: #004c99;
        color: white;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        margin-bottom: 15px;
    }

    .card-reporte h3 {
        color: #004c99;
        margin: 0 0 10px 0;
        font-size: 18px;
    }

    .card-reporte p {
        font-size: 14px;
        color: #666;
        margin: 0 0 20px 0;
        line-height: 1.4;
    }

    .card-reporte .btn-entrar {
        background: #007acc;
        color: white;
        padding: 8px 20px;
        border-radius: 6px;
        font-weight: bold;
        font-size: 14px;
    }
</style>
<div class="header">
    Reporte 5: Historial de Pagos de Obligación
    <a href="/admin/reportes" class="back">← Cambiar Reporte</a>
</div>
<div class="container">
    <h2>Localizar Obligación Crediticia</h2>
    <form method="GET">
        <div class="search-input-group" style="display:flex; gap:10px; margin-bottom: 25px;">
            <input type="text" name="id_credito" placeholder="Ingrese el código o número del pagaré/crédito..." required style="flex:4; padding:10px;">
            <button type="submit" class="btn" style="flex:1;">Buscar Plan</button>
        </div>
    </form>
    <table>
        <thead>
            <tr><th>N° Cuota</th><th>Vencimiento Programado</th><th>Fecha Real Pago</th><th>Valor Satisfecho</th><th>Estado Cuota</th></tr>
        </thead>
        <tbody><tr><td colspan="5">Consulte un número de obligación para auditar la amortización</td></tr></tbody>
    </table>
</div>
{% endblock %}
