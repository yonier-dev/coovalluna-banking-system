{% extends "base.html" %}
{% block contenido %}
<style>
    body {
        background: #f4f7fb;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        margin: 0;
        box-sizing: border-box;
    }

    .header {
        background: linear-gradient(90deg, #004c99, #007acc);
        color: #fff;
        padding: 20px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        width: 100%;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10;
        box-sizing: border-box;
    }

    .logout { position: absolute; top: 20px; right: 30px; color: #fff; text-decoration: none; font-size: 14px; }
    .back { position: absolute; top: 20px; left: 30px; color: #fff; text-decoration: none; font-size: 14px; }

    .pago-box {
        margin-top: 120px;
        background: #fff;
        border: 3px solid #004c99;
        border-radius: 12px;
        padding: 30px 40px;
        width: 600px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #004c99;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px 30px;
    }

    label {
        font-weight: bold;
        color: #004c99;
        display: block;
        margin-bottom: 6px;
    }

    input, select {
        width: 100%;
        padding: 10px;
        border: 2px solid #007acc;
        border-radius: 8px;
        font-size: 14px;
    }

    input:focus, select:focus {
        border-color: #004c99;
        outline: none;
    }

    .submit-btn {
        grid-column: span 2;
        padding: 14px;
        background: linear-gradient(90deg, #004c99, #007acc);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .submit-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .error, .success {
        grid-column: span 2;
        font-size: 14px;
        margin-top: 10px;
        text-align: center;
        font-weight: bold;
        display: none;
    }

    .error { color: #cc0000; }
    .success { color: green; }
</style>

<div class="header">
     Registro de Pago de Cuota
    <a href="/asesor/dashboard" class="back">← Volver</a>
    <a href="/logout" class="logout">Cerrar sesión</a>
</div>

<div class="pago-box">
    <h2>Formulario de Pago</h2>
    <form id="pagoForm" class="form-grid" method="POST">
      <div>
        <label for="cedula">Cédula del Asociado</label>
        <input id="cedula" name="cedula" type="text" placeholder="Ingrese la cédula" required>
      </div>
      <div>
        <label for="credito">Número de Crédito</label>
        <input id="credito" name="credito" type="text" placeholder="Ingrese número de crédito" required>
      </div>
      <div>
        <label for="cuota">Número de Cuota</label>
        <input id="cuota" name="cuota" type="number" placeholder="Ingrese número de cuota" required>
      </div>
      <div>
        <label for="valor">Valor Pagado</label>
        <input id="valor" name="valor" type="number" placeholder="Ingrese valor pagado" required>
      </div>
      <div>
        <label for="estado">Estado de la Cuota</label>
        <select id="estado" name="estado" required>
          <option value="">Seleccione</option>
          <option value="Pagada">Pagada</option>
          <option value="Pendiente">Pendiente</option>
          <option value="Mora">Mora</option>
        </select>
      </div>

      <button type="submit" class="submit-btn">Registrar Pago</button>
      <div id="errorMsg" class="error">⚠️ Datos incompletos</div>
      <div id="successMsg" class="success">✅ Pago registrado correctamente</div>
    </form>
</div>

<script>
    const form = document.getElementById('pagoForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const cedula = document.getElementById('cedula').value.trim();
      const credito = document.getElementById('credito').value.trim();
      const cuota = document.getElementById('cuota').value.trim();
      const valor = document.getElementById('valor').value.trim();
      const fecha = document.getElementById('fecha').value;
      const estado = document.getElementById('estado').value;

      if (cedula !== "" && credito !== "" && cuota !== "" && valor !== "" && fecha !== "" && estado !== "") {
        errorMsg.style.display = "none";
        successMsg.style.display = "block";
        form.reset();
      } else {
        successMsg.style.display = "none";
        errorMsg.style.display = "block";
      }
    });
</script>
{% endblock %}
